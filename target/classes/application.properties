# =============================================================================
#  src/main/resources/application.properties
#  Spring Boot File Manager API — Configuration
# =============================================================================

# ── Server ───────────────────────────────────────────────────────────
server.port=8080
server.address=0.0.0.0

# ── Application Name ──────────────────────────────────────────────────────────
spring.application.name=file-manager-api

# ── File Upload Limits ────────────────────────────────────────────────────────
# Max size of a single uploaded file (increase if you need larger files)
spring.servlet.multipart.max-file-size=500MB

# Max size of the entire multipart request
spring.servlet.multipart.max-request-size=500MB

# Enable multipart uploads explicitly
spring.servlet.multipart.enabled=true

# ── File Storage Directory ────────────────────────────────────────────────────
# This is where uploaded files will be stored on your PC.
# Windows example:  file.upload-dir=D:/FileStorage
# Linux/macOS:      file.upload-dir=/home/yourname/FileStorage
#
# The app will CREATE this folder automatically if it doesn't exist.
# ⚠️  CHANGE THIS PATH to wherever you want files stored on your PC.
file.upload-dir=D:/FileStorage

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.filemanager=DEBUG
logging.level.org.springframework.web=INFO